type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
  - userId
  - photo
properties:
  _id:
    description: "Contact's id"
    type: string
    example: '672a957ad0e643ced50c9d0d'
  name:
    description: "Contact's name"
    type: string
    example: Ivan Andrinenko
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: +380000400009
  email:
    description: "Contact's email"
    type: string
    example: ivan+2@example.com
  isFavourite:
    description: 'Whether this contact is marked as favourite'
    type: boolean
    default: false
    example: false
  contactType:
    description: 'Type of the contact (e.g., work, home, personal)'
    type: string
    enum: ['work', 'home', 'personal']
    default: personal
    example: personal
  # userId:
  #   description: "Contact's user id"
  #   type: string
  #   example: 6727b80847ee4d8366eaca74
  photo:
    description: "URL to the contact's photo"
    type: string
    default: null
    format: binary
    example: https://res.cloudinary.com/dj9ztnk5t/image/upload/v1730844200/g1vn9ttk5rjd7vnvbfk0.jpg
