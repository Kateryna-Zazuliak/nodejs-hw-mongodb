description: 'Bad Request (Validation errors)'
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: 'Bad Request(Invalid data provided)'
        data:
          type: object
          required:
            - message
            - errors
          properties:
            message:
              type: string
              example: 'Bad request'
            errors:
              type: array
              items:
                items:
                  type: object
                  properties:
                    message:
                      type: string
                      example: 'Password must be a string'
