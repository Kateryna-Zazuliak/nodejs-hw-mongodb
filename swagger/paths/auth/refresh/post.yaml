tags:
  - Auth
summary: Refreshed a session
operationId: refreshSession
description: 'Refreshed a session'
security:
  - bearerAuth: []
responses:
  '200':
    description: 'Successfully refreshed a session!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully refreshed a session!'
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'ePGrIHbnig8ReScYNSL4M3Rui7NxNn9Pz26EzuRr'
  '401':
    $ref: ../../../components/responses/401.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
