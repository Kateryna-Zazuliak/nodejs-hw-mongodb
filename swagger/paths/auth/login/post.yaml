tags:
  - Auth
summary: Logged in a new user
operationId: loginUser
description: 'Successfully logged in an user!'
security:
  - {}
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: "User's email"
            type: string
            example: user@example.com
          password:
            description: "User's password"
            type: string
            example: password
responses:
  '200':
    description: 'Successfully logged in an user'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged in an user!'
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'ePGrIHbnig8ReScYNSL4M3Rui7NxNn9Pz26EzuRr'
  '400':
    $ref: ../../../components/responses/400.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
