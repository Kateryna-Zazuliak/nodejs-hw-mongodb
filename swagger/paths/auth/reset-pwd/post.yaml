tags:
  - Auth
summary: Reset and change password
operationId: resetPassword
description: 'Reset and change password'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          password:
            description: 'The new password for the user.'
            type: string
            example: 'newPassword123!'
          token:
            description: 'The reset token received by email'
            type: string
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2NzI3YjgwODQ3ZWU0ZDgzNmVlY2E3NCIsImVtYWlsIjoidXNlckBleGFtcGxlLmNvbSIsImlhdCI6MTY2MjM4NjYzMywiZXhwIjoxNjYyMzg4MjMzfQ.M_9_RohV7OrzgsLzRaPOOjiPRh_T3mJfw7aD8Trjz1VQ!'
responses:
  '200':
    description: 'Password has been successfully reset.'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Password has been successfully reset.'
            data:
              type: object
              properties: {}
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
