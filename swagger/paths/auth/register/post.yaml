tags:
  - Auth
summary: Register a new user
operationId: registerUser
description: 'Create a new user account in the system'
security:
  - {}
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: "User's full name"
            type: string
            example: John Doe
          email:
            description: "User's email"
            type: string
            example: user@example.com
          password:
            description: "User's password"
            type: string
            example: strongpassword
responses:
  '201':
    description: 'User successfully registered'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully registered the user!'
            data:
              $ref: ../../../components/schemas/user.yaml
  '400':
    $ref: ../../../components/responses/400.yaml
  '409':
    description: 'Conflict (User already exists)'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 409
            message:
              type: string
              example: 'User already exists'
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: 'User with this email is already exist!'
  '500':
    $ref: ../../../components/responses/500.yaml
